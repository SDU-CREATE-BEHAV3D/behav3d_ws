print_field_oriented_sequence:
  ros__parameters:
    # Global flow
    home_before_scan: true
    home_after: false
    timeout_s: 0.0
    debug_mode: false
    prompt_before_print: true
    prompt_before_scan: true
    enable_scan: true

    # Initial table grid sweep
    frame_id: world
    # Select one: grid_sweep, half_cylinder, half_cylinder_side_caps.
    scan_type: grid_sweep
    scan_eef_link: femto_color_optical_calib
    scan_motion: LIN
    scan_use_tf_orientation: true
    scan_width: 0.50
    scan_height: 0.40
    scan_center_x: -0.20
    scan_center_y: 0.80
    scan_center_z: 0.0
    scan_z_off: 0.60
    scan_nx: 5
    scan_ny: 4
    scan_row_major: false
    scan_capture_folder: "@session/grid_sweep"
    scan_debug_prompt: false
    scan_debug: false
    scan_vel_scale: 0.1
    scan_accel_scale: 0.1
    scan_settle_s: 0.5
    scan_prompt: ""
    scan_rgb: true
    scan_depth: true
    scan_ir: true
    scan_pose: true
    scan_publish_markers: true
    scan_axis_length: 0.05
    scan_axis_radius: 0.003
    scan_clear_markers_before: true
    scan_clear_markers_after: true

    # Half-cylinder scan parameters. Active when scan_type=half_cylinder
    # or scan_type=half_cylinder_side_caps.
    half_use_line_axis: true
    half_axis_start_x: 0.15
    half_axis_start_y: 0.85
    half_axis_start_z: -0.20
    half_axis_end_x: -0.45
    half_axis_end_y: 0.85
    half_axis_end_z: -0.20
    half_radius: 0.60
    half_angle_min_deg: -35.0
    half_angle_max_deg: 35.0
    half_n_angle: 5
    half_n_axis: 7
    half_arc_center_dx: 0.0
    half_arc_center_dy: 0.0
    half_arc_center_dz: 1.0
    half_orientation_mode: look_at
    half_roll_deg: 0.0
    half_row_major: false
    half_center_x: -0.17
    half_center_y: 0.85
    half_center_z: 0.90
    half_height: 0.0
    half_n_height: 3

    # Side-cap parameters. Active when scan_type=half_cylinder_side_caps.
    # endcap_radius <= 0 means reuse half_radius.
    endcap_radius: 0.0
    endcap_angle_min_deg: -35.0
    endcap_angle_max_deg: 35.0
    endcap_n_angle: 3
    endcap_polar_min_deg: 20.0
    endcap_polar_max_deg: 60.0
    endcap_n_polar: 3
    endcap_include_start: true
    endcap_include_end: true
    endcap_row_major: false

    # Cycle grid sweep. X/Y and base center are fixed from config.
    # After a print cycle, scan height is adaptive:
    #   abs_scan_z = highest_generated_target_z + grid_z_off
    #   applied z_off = abs_scan_z - grid_center_z
    # Before any printed target exists, it falls back to grid_center_z + grid_z_off.
    grid_width: 0.50
    grid_height: 0.15
    grid_center_x: -0.20
    grid_center_y: 0.85
    grid_center_z: -0.30
    grid_z_off: 0.60
    grid_nx: 5
    grid_ny: 2
    grid_row_major: false
    grid_use_tf_orientation: true
    field_center_sign_x: -1.0
    field_center_sign_y: -1.0
    field_center_offset_x: 0.0
    field_center_offset_y: 0.0

    # Reconstruction + world mesh
    run_reconstruction: true
    reconstruct_device: CPU:0
    reconstruct_request_timeout_s: 10.0
    wait_reconstruction_outputs: true
    color_to_depth_wait_timeout_s: 60.0
    tsdf_wait_timeout_s: 180.0
    mesh_prefer: mesh
    mesh_update_wait_timeout_s: 45.0
    mesh_update_request_timeout_s: 55.0
    tsdf_center_crop_enable: true
    tsdf_center_crop_width: 300
    tsdf_center_crop_height: 290
    tsdf_center_crop_apply_to_depth: true
    tsdf_aabb_crop_enable: false
    tsdf_aabb_crop_min: [-0.25, -1.10, -1.00]
    tsdf_aabb_crop_max: [0.30, -0.65, 0.50]
    tsdf_param_update_timeout_s: 8.0

    # Field init
    run_field_init: true
    field_use_latest: true
    field_session_path: "@session"
    field_scan_mesh_path: ""
    field_mesh_path: /home/lab/behav3d_ws/mesh/doublewall_iterative_loop_340mm.obj
    field_state_output_dir: "@session/field_loop/init"
    field_request_timeout_s: 120.0
    fields_node_name: /behav3d_fields
    field_position_param_timeout_s: 5.0
    field_seed_level: 5.0
    field_require_full_hit: true
    field_base_z_offset: 0.005
    field_use_position_target: true
    field_position_target_x: -0.20
    field_position_target_y: 0.85
    skip_bootstrap_scan_and_init: true
    resume_field_state_path: /home/lab/behav3d_ws/mesh/fields/field_state_init.npz
    resume_scan_mesh_path: /home/lab/behav3d_ws/captures/260317_171335/field_loop/cycle_0000/scan/reconstruct/tsdf_surface_mesh.stl
    scan_before_generate_first_cycle: false
    # Candidate generation
    run_generate_candidates: true
    candidate_use_latest: true
    candidate_session_path: "@session"
    candidate_field_state_path: ""
    candidate_scan_mesh_path: ""
    candidate_output_dir: "@session/field_loop/cycle_0001"
    candidate_request_timeout_s: 120.0
    candidate_mode: z_lift
    candidate_beads_per_step: 2
    candidate_bead_separation_mm: 38.0
    candidate_bead_height_mm: 20.0
    # If gradient walk mode
    candidate_walk_distance_mm: 10.0
    candidate_walk_step_mm: 0.5
    candidate_walk_max_steps: 60
    candidate_walk_start_fraction: 0.45
    candidate_target_zx: 0.03
    candidate_target_zy: -0.01
    candidate_target_zz: 1.0
    candidate_target_position_scale: 1000.0
    candidate_visualize_field_ply: true
    candidate_restore_scan_mesh_after_field_ply: true
    candidate_publish_markers: true
    candidate_marker_axis_length: 0.05
    candidate_marker_axis_radius: 0.003
    candidate_marker_clear_before: true

    # Print selection. Use "dots" for z_lift/simple point deposition,
    # "segments" for oriented segment printing, or "auto" to follow YAML shape.
    print_mode: dots

    # Dot print mode. Active when print_mode=dots, or print_mode=auto with targets YAML.
    dot_eef_link: extruder_tcp
    dot_steps: 25000
    dot_speed: 2400
    dot_approach_z_offset_m: 0.30
    dot_z_offset_m: 0.04
    dot_pre_vel_scale: 0.20
    dot_print_vel_scale: 0.10
    dot_accel_scale: 0.10
    dot_dwell_s: 0.4
    post_dot_retract_steps: 3000
    post_dot_retract_speed: 7000

    # Oriented target generation. Used by candidate generation when enabled.
    oriented_targets_enable: false
    oriented_tangent_sign: 1.0
    oriented_clamp_to_cone: true
    oriented_cone_max_tilt_deg: 36.0
    oriented_base_to_world_yaw_deg: 180.0

    # Segment print mode. Active when print_mode=segments,
    # or print_mode=auto with segments YAML.
    segment_print_speed: 2950
    segment_approach_z_offset_m: 0.40
    segment_travel_z_offset_m: 0.05
    segment_approach_vel_scale: 0.4
    segment_travel_vel_scale: 0.4
    segment_print_vel_scale: 0.01
    segment_accel_scale: 0.2
    segment_target_print_speed_mm_s: 2.6
    post_segment_wait_s: 1.5
    post_segment_retract_s: 0.7
    post_segment_retract_speed: 7000
    max_cycles: 0
    prompt_before_next_cycle: true
