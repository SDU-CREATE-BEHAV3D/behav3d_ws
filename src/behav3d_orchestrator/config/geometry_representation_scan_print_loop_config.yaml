geometry_representation_scan_print_loop:
  ros__parameters:
    # Global flow
    home_before_scan: false
    home_after: false
    timeout_s: 0.0
    debug_mode: false
    prompt_before_print: false
    prompt_before_scan: false
    enable_scan: true

    # Select one: grid_sweep, half_cylinder, half_cylinder_side_caps.
    scan_type: grid_sweep
    # Common scan execution. Motion remains fixed to LIN.
    scan_vel_scale: 0.15
    scan_accel_scale: 0.15
    scan_settle_s: 1.2

    # Half-cylinder scan parameters. Active when scan_type=half_cylinder
    # or scan_type=half_cylinder_side_caps.
    half_use_line_axis: true
    half_axis_start_x: 0.06
    half_axis_start_y: 0.85
    half_axis_start_z: 0.35
    half_axis_end_x: -0.03
    half_axis_end_y: 0.85
    half_axis_end_z: 0.35
    half_radius: 0.45
    half_angle_min_deg: -40.0
    half_angle_max_deg: 40.0
    half_n_angle: 3
    half_n_axis: 1
    half_arc_center_dx: 0.0
    half_arc_center_dy: 0.0
    half_arc_center_dz: 1.0
    half_orientation_mode: look_at
    half_roll_deg: 0.0
    half_row_major: false

    # Side-cap parameters. Active when scan_type=half_cylinder_side_caps.
    # endcap_radius <= 0 means reuse half_radius.
    endcap_radius: 0.0
    endcap_angle_min_deg: -35.0
    endcap_angle_max_deg: 35.0
    endcap_n_angle: 2
    endcap_polar_min_deg: 20.0
    endcap_polar_max_deg: 40.0
    endcap_n_polar: 2
    endcap_include_start: true
    endcap_include_end: true
    endcap_row_major: false

    # Cycle grid sweep. X/Y and base center are fixed from config.
    # After a print cycle, scan height is adaptive:
    #   abs_scan_z = highest_generated_target_z + grid_z_off
    #   applied z_off = abs_scan_z - grid_center_z
    # Before any printed target exists, it falls back to grid_center_z + grid_z_off.
    grid_width: 0.35
    grid_height: 0.35
    grid_center_x: 0.00
    grid_center_y: 0.90
    grid_center_z: -0.1
    grid_z_off: 0.6
    grid_nx: 3
    grid_ny: 3
    grid_row_major: false
    grid_use_tf_orientation: false
    field_center_sign_x: -1.0
    field_center_sign_y: -1.0
    field_center_offset_x: 0.0
    field_center_offset_y: 0.0

    # Reconstruction + world mesh
    run_reconstruction: true
    reconstruct_device: CPU:0
    reconstruct_request_timeout_s: 10.0
    wait_reconstruction_outputs: true
    color_to_depth_wait_timeout_s: 60.0
    tsdf_wait_timeout_s: 180.0
    mesh_prefer: mesh
    mesh_update_wait_timeout_s: 45.0
    mesh_update_request_timeout_s: 55.0
    tsdf_center_crop_enable: true
    tsdf_center_crop_width: 350
    tsdf_center_crop_height: 350
    tsdf_center_crop_apply_to_depth: true
    tsdf_aabb_crop_enable: false
    tsdf_aabb_crop_min: [-0.25, -1.10, -1.00]
    tsdf_aabb_crop_max: [0.30, -0.65, 0.50]
    tsdf_param_update_timeout_s: 8.0

    # Here run field made in grasshopper:
    resume_field_state_path: /home/lab/behav3d_ws/Week_02_experiments/G05/Export files/E02_G05_Updated2.npz
    resume_scan_mesh_path: ""
    scan_before_generate_first_cycle: true

    # Candidate generation
    candidate_session_path: "@session"
    candidate_output_dir: "@session/field_loop/cycle_0001"
    candidate_request_timeout_s: 120.0
    candidate_mode: gradient_lift
    candidate_beads_per_step: 10

    # Width mode selection:
    #   fixed: candidate_bead_separation_mm controls center-to-center spacing.
    #          candidate_bead_width_mm records the nominal fixed bead width.
    #          targets omit volume_mm3 and printing uses the selected mode's
    #          dot_steps or segment_steps fallback.
    #   field: candidate_width_field_path must be an NPZ containing width_norm
    #          in [0, 1], with the same vertex count/order as the scalar field.
    #          Width maps linearly from min to max; spacing is computed from
    #          neighboring widths and candidate_bead_overlap_mm. Generated
    #          targets contain volume_mm3 and printing converts it to steps.
    candidate_width_mode: fixed

    # Common to both width modes.
    candidate_bead_height_mm: 15.0

    # Fixed mode parameters.
    candidate_bead_separation_mm: 20.0
    # this doesnt add nothing
    candidate_bead_width_mm: 28.0

    # Field mode parameters. These are ignored in fixed mode.
    candidate_width_field_path: "/home/lab/behav3d_ws/Week_02_experiments/G02/export/width_field.npz"
    candidate_bead_width_min_mm: 14.0
    candidate_bead_width_max_mm: 36.0
    candidate_bead_overlap_mm: 4.0
    # Scales analytic volume_mm3 before writing target YAML. Values below
    # 1.0 reduce extrusion; values above 1.0 increase it. Ignored in fixed mode
    # where target YAML has no per-candidate volume.
    candidate_volume_factor: 1.0
    # For gradient_lift segment output, move start toward end by this distance.
    # Ignored for dots and gradient_walk.
    candidate_segment_start_offset_mm: 8.0

    # Print selection. Use "dots" for z_lift/simple point deposition,
    # "segments" for oriented segment printing, or "auto" for legacy mode-based
    # output. This selection is independent from gradient_lift/gradient_walk.
    print_mode: segments
    log_joint_currents: false

    # Dot print mode. Active when print_mode=dots, or print_mode=auto with targets YAML.
    dot_eef_link: extruder_tcp
    # Net material steps for a fixed-width bead. Do not add retract here:
    # PrintSession sends dot_steps + post_dot_retract_steps, then retracts.
    # A target volume_mm3 overrides the fixed-step fallback for its print mode.
    dot_steps: 6000
    # Theoretical unit calibration: 64000 steps / (pi * 50^2 mm2 * 10 mm).
    # Do not tune extrusion with this value; use candidate_volume_factor.
    extrusion_steps_per_mm3: 0.8148733086
    dot_speed: 2800
    dot_approach_z_offset_m: 0.30
    dot_z_offset_m: 0.06
    dot_pre_vel_scale: 0.2
    dot_print_vel_scale: 0.2
    dot_accel_scale: 0.2
    dot_dwell_s: 0.5
    # Compensation is automatic when both retract values are positive.
    post_dot_retract_steps: 5000
    post_dot_retract_speed: 7000

    # Oriented target generation. Used by candidate generation when enabled.
    oriented_targets_enable: true
    oriented_tangent_sign: 1.0
    oriented_clamp_to_cone: true
    oriented_cone_max_tilt_deg: 20.0
    oriented_base_to_world_yaw_deg: 180.0

    # Segment print mode. Active when print_mode=segments,
    # or print_mode=auto with segments YAML.
    # Net material steps used when a segment has no volume_mm3.
    segment_steps: 5000
    # Extruder pulse rate. PrintSession derives TCP speed from segment length
    # and forward steps so the gated extrusion delivers the requested amount.
    segment_steps_per_second: 2800
    segment_approach_z_offset_m: 0.4
    segment_travel_z_offset_m: 0.12
    segment_approach_vel_scale: 0.2
    segment_travel_vel_scale: 0.2
    segment_print_vel_scale: 0.01
    segment_accel_scale: 0.1
    post_segment_wait_s: 1.0
    # Compensation is automatic when both retract values are positive.
    post_segment_retract_steps: 5000
    post_segment_retract_speed: 7000
    max_cycles: 0
