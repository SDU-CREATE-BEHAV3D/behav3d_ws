schema_version: 5
experiment_name: field_state_init2_point_bead_fixture

paths:
  # Paths are relative to the workspace root.
  field_state: mesh/fields/field_state_init2.npz
  width_field: mesh/fields/width_field.npz
  scan_mesh: mesh/ScanMesh.stl
  extruder_mesh: src/custom_workcell/ur20_workcell/meshes/ram_extruder_v2_simplified.dae

scan:
  scale: 0.001
  yaw_deg: 180.0

goal:
  representation: open_triangle_surface_3d
  current_fixture_evaluator: vertical_height_rays
  vertex_role: evaluation_and_observation_sample
  vertices_are_print_targets: false
  vertex_count: 5721
  face_count: 11147
  connected_components: 1
  area_m2: 0.08018726390699071
  initial_vertical_ray_hit_count: 5721
  initial_phi_min_m: -0.005758697509765626
  initial_phi_median_m: 0.12441693115234374
  initial_phi_max_m: 0.2959978942871094
  fill_direction: world_z
  envelope: vertical_sweep_from_initial_scan

intersection:
  deposition_boundary: interpolated_phi_zero_segment_union_3d
  preserve_scan_goal_contour: true
  iso_level_m: 0.0

vertex_frontier:
  definition: unfilled_vertex_adjacent_to_filled_vertex
  role: auxiliary_observation_and_debug_only
  use_as_print_target: false

completion:
  evaluator: vertical_phi
  area_weighted: true
  fill_tolerance_mm: 2.0
  success_completed_area_fraction: 0.99

scalar_fields:
  heat_order: low_to_high
  width_key: width_norm
  width_min_mm: 16.0
  width_max_mm: 36.0
  nominal_overlap_reference_mm: 4.0

dds:
  deposit_mode: point
  voxel_size_mm: 2.0
  occupancy_threshold: 0.5
  domain_source: field
  padding_mm: 40.0

action:
  deposits_per_step: 1
  policy_representation: direct_continuous
  normalized_box: [-1.0, 1.0]
  dimensions:
    - source_coord
    - height_ctrl
    - orient_x
    - orient_y
    - width_ctrl
  source_geometry: interpolated_phi_zero_segment_union_3d
  source_parameterization: canonical_component_cumulative_arc_length
  component_order: lexicographic_minimum_3d_coordinate
  segment_order: welded_contour_connectivity
  disconnected_contours: deterministic_component_concatenation
  target_reference: bead_top
  cone_axis: world_positive_z
  cone_parameterization: concentric_square_to_disk
  cone_max_tilt_deg: 30.0
  zero_orientation_is_vertical: true
  contact_ray_direction: negative_deposition_z
  contact_distance_min_mm: 10.0
  contact_distance_max_mm: 16.0
  contact_source_tolerance_mm: 1.0
  bead_height_mode: policy_selected_then_contact_validated
  bead_height_min_mm: 10.0
  bead_height_max_mm: 16.0
  width_mode: policy_delta_from_interpolated_goal_width
  width_delta_min_mm: -4.0
  width_delta_max_mm: 4.0
  bead_width_min_mm: 16.0
  bead_width_max_mm: 36.0
  invalid_width_behavior: reject_and_penalize

observation:
  contour_sample_count: 256
  contour_sampling: canonical_component_arc_midpoints
  component_allocation: one_minimum_then_length_proportional
  contour_features:
    - source_coord
    - position_xyz
    - heat
    - target_width
    - component_index
    - valid_mask
  samples_are_candidate_actions: false

collision:
  checker: existing_extruder_mesh_vertex_distance_proxy
  threshold_mm: 1.0
  tcp_exclusion_radius_mm: 10.0
  rejection_behavior: keep_state_and_penalize
  silently_replace_policy_action: false

reward:
  # Collision remains a hard safety rejection plus an explicit learning signal.
  collision_penalty: -10.0
  collision_terminates_episode: false
  # Stability terms are dimensionless raw costs and should be logged separately.
  # Their final weights are deliberately not frozen before reward auditing.
  tilt_cost: normalized_quadratic
  cantilever_cost: lateral_shift_over_bead_width_squared
  tilt_is_weak_regularizer: true

overlap:
  metric: lateral_geometric_overlap_mm
  target_mm: 4.0
  tolerance_mm: 1.0

episode:
  state_backend: incremental_dds_simulator
  reset_behavior: clear_deposits_and_reuse_dense_fields
  initial_scan_role: immutable_raycast_geometry
  current_material_mesh: initial_scan_plus_dds_surface_triangle_soup
  max_deposits: 500
  max_consecutive_no_progress: 20
  max_consecutive_invalid_actions: 20

baseline:
  policy: current_heuristic_only_for_evaluation
  command: gradient_lift
  beads_per_step: 7
  behavior_cloning: false

ppo:
  initialization: from_scratch
  behavior_cloning: false
  action_space: Box(-1, 1, shape=(5,))
  direct_action_decoder: rl_trials.action_decoder.decode_continuous_action

pending_decisions:
  reward_weights:
    recommended: null
    reason: set only after geometric reward-component audit
